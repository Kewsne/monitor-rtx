name: Monitor RTX 5060

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:         # permite rodar manualmente pela aba Actions

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      # Recupera a lista de produtos já avisados (para não repetir alertas)
      - uses: actions/cache/restore@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Verificar preços na Kabum
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
        run: python3 monitor.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
